[project]
name = "harness-common"
version = "0.1.0"
description = "Shared config, ports, and trace-header helpers for the distributed tracing harness"
requires-python = ">=3.11"
dependencies = ["langsmith>=0.14.4", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
